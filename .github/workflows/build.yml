name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        shell: cmd
        run: build.bat

      - name: Ekran görüntüsü al
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W { [StructLayout(LayoutKind.Sequential)] public struct R { public int L, T, Rt, B; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out R r);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); }
          "@
          $p = Start-Process -FilePath dist\SesKalkani.exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh(); $h = $p.MainWindowHandle
          [W]::SetForegroundWindow($h) | Out-Null; Start-Sleep -Seconds 1
          $r = New-Object W+R; [W]::GetWindowRect($h, [ref]$r) | Out-Null
          $w = $r.Rt - $r.L; $hh = $r.B - $r.T
          if ($w -lt 50) { $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds; $r.L=0; $r.T=0; $w=$b.Width; $hh=$b.Height }
          $bmp = New-Object System.Drawing.Bitmap $w, $hh
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($r.L, $r.T, 0, 0, $bmp.Size)
          $bmp.Save("screen.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          "SCREENSHOT_B64_BEGIN"; [Convert]::ToBase64String([IO.File]::ReadAllBytes("screen.png")); "SCREENSHOT_B64_END"

      - uses: actions/upload-artifact@v4
        with:
          name: SesKalkani
          path: |
            dist/SesKalkani.exe
            screen.png

      # Sürüm yayınlamak için commit mesajına [release] yaz (sürüm: src/AssemblyInfo.cs)
      - name: Sürümü oku
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Item dist\SesKalkani.exe).VersionInfo.FileVersion -replace '\.0$',''
          "v=$v" >> $env:GITHUB_OUTPUT

      - name: Sürümü yayınla
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Ses Kalkanı ${{ steps.ver.outputs.v }}
          body_path: .github/release-notes.md
          files: dist/SesKalkani.exe
