name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derle
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: SesKalkani
          path: dist/SesKalkani.exe

      # Sürüm yayınlamak için commit mesajına [release] yaz (sürüm: src/AssemblyInfo.cs)
      - name: Sürümü oku
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Item dist\SesKalkani.exe).VersionInfo.FileVersion -replace '\.0$',''
          "v=$v" >> $env:GITHUB_OUTPUT

      - name: Sürümü yayınla
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Ses Kalkanı ${{ steps.ver.outputs.v }}
          body_path: .github/release-notes.md
          files: dist/SesKalkani.exe
